spring.application.name=mining-service
server.port=8081

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=myuser
spring.rabbitmq.password=secret

# Backpressure: limita quantas mensagens sao processadas em paralelo e quantas ficam
# "em voo" por consumidor, para o robo nao ser sobrecarregado com comandos.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=3
spring.rabbitmq.listener.simple.prefetch=5

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:mining-service
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=fiap
spring.datasource.password=
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
